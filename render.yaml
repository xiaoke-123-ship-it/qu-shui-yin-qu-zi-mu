services:
  - name: qu-shui-yin-qu-zi-mu
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: qu-shui-yin-qu-zi-mu-db
          property: connectionString
      - key: TOKEN_SECRET
        generateValue: true
databases:
  - name: qu-shui-yin-qu-zi-mu-db
    plan: free
